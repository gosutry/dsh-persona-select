name: Cleanup placeholder versions

# 一次性：撤掉三个包上 npm 自动留的 0.0.0-stage 占位版本。
# 触发方式只有 push —— 推这一版时跑一次；随后把本文件删掉，删除那次推送不会重复触发。
on: push

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Unpublish 0.0.0-stage
        run: |
          set +e
          for p in dsh-persona-select dsh-persona-select-picker dsh-persona-select-settings; do
            echo "--- $p ---"
            npm unpublish "$p@0.0.0-stage" --force
            echo "exit=$?"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
