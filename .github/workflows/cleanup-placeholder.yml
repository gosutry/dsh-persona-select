name: Cleanup placeholder versions

# 一次性：撤 0.0.0-stage 占位，并把 npm 原话写回仓库（cleanup-result.md）。
# 结果提交带 [skip ci]，不会再触发自己。
on: push

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Unpublish and record
        run: |
          {
            echo "# cleanup result"
            echo
            date -u
            echo
          } > cleanup-result.md
          for p in dsh-persona-select dsh-persona-select-picker dsh-persona-select-settings; do
            echo "## $p" >> cleanup-result.md
            npm unpublish "$p@0.0.0-stage" --force >> cleanup-result.md 2>&1 || echo "exit=$?" >> cleanup-result.md
            echo "" >> cleanup-result.md
          done
          cat cleanup-result.md
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit result
        run: |
          git config user.name "dsh-cleanup-bot"
          git config user.email "dsh-cleanup-bot@users.noreply.github.com"
          git add cleanup-result.md
          git commit -m "chore: cleanup result [skip ci]" || echo "nothing to commit"
          git push
