name: Cleanup placeholder versions

# 一次性诊断：撤掉 0.0.0-stage 占位，并把 npm 的原话写成 annotation（页面上能直接看到）。
on: push

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Unpublish 0.0.0-stage
        run: |
          for p in dsh-persona-select dsh-persona-select-picker dsh-persona-select-settings; do
            out=$(npm unpublish "$p@0.0.0-stage" --force 2>&1)
            code=$?
            msg=$(printf '%s' "$out" | tr '\n' ' ' | cut -c1-220)
            if [ "$code" -eq 0 ]; then
              echo "::notice title=OK $p::$msg"
            else
              echo "::error title=FAIL $p exit=$code::$msg"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
