# ============================================================================
# dsh-persona-select —— 一个插件卡，两个组件行
# ============================================================================
# 两行都指向主包的依赖包（不出卡片，只是组件）：
#   dsh-persona-select-picker    会话输入区列表（自己的浏览器半 → 开关是真卸载）
#   dsh-persona-select-settings  设置页「人设管理」（自己的浏览器半）
# 内核（路由/注入/存储）在两个组件宿主里通过 dsh-persona-select/core 共享持有，
# 不单独占一行；停用任一组件都不会连累另一个。
- insert:
    - id: persona-select-picker
      name: dsh-persona-select-picker
    - id: persona-select-settings
      name: dsh-persona-select-settings
