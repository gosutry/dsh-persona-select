# dsh-persona-select 的 bundle 层：以裸包名插入 profile 树。
#
# 一行同时承载两个半边（与 dsh-prompt-setting 同构）：
#   host   半边：`/persona-select/*` 路由（含 0.2.8 的 `/resident` 采样与
#                `/gc` 清理、0.3.0 的 `/import` 导入、0.3.1 的 `/handoff`
#                导出交接（0.3.2 起支持 HEAD 探路与 Range 续传；0.3.3 起
#                文件名跟在取件 URL 的最后一段 —— 下载桥是拿 URL 取名的））
#                + prompt 段（全局一份 +
#                每个 agent 的 scoped 覆盖）+ `personaSelectHistory` 投影单元、
#                `agent/pre-step` 历史对话注入
#                （0.3.4 起同一个监听器还按 source.kind 过滤运行时快照 /
#                 技能目录这两类 `<system-reminder>` 注入块；
#                 0.3.6 起注入的正文框在 `<system-reminder>` 外框里 ——
#                 与工作区指令链 / 技能目录同一套写法，正文自带的收尾标签
#                 会先转义；
#                 0.3.5 起 /state 多报 `section.indicators`（全部触发项，
#                 红在前、黄在后）与 `section.minimalMode` —— 后者按会话问
#                 `agents.get(id).agentPreset` + `agentPresets.readDocument()`
#                 认「这个 preset 声明了 complete 段」，所以「极简模式报黄」
#                 不再依赖装配读数、也不看有没有发生过对话；
#                 0.3.16 起同一个监听器还管「人设切换 → 收敛」：本会话选定的
#                 人设 id 变了的那一步返回 `startsRequestSeries: true`，让 loop
#                 改写第 0 号节点、清空 in-history 累积的系统节点（判据取真实
#                 装配的读数；空 messages 的步骤不记账，留到下一个真请求）；
#                 0.3.17 起这份读数按会话落盘（`sessions[<id>].promptPersonaId`，
#                 采样时写一次、每切换一次写一次）—— agent 在重启 / 恢复会话 /
#                 可续子会话里会被换掉，只按 agent 对象记账的话第一次切换必漏））
#   client 半边：设置页「人设管理」（0.2.8 起分「当前 / 全局」两页；0.3.0 起
#                两个键只剩两个字、键下只显示会话 id，并多了人设导入 / 导出；
#                0.3.1 起「导出」是一键菜单，可导纯 JSON，也可把人设装进一张
#                自选 PNG 的 iTXt 块里；0.3.4 起列表勾边只画在正在预览的那一条、
#                「启用」提示点名启用了哪一条、注入块过滤状态显示在开关卡里；
#                0.3.7 起列表勾边改成「长写键在两支都存在」的写法（勾边色只在
#                预览那一支出现时，react-dom 取消预览会把 borderColor 置空，
#                button 的 appearance:auto 就回落到 UA 的 #767676，留下灰框）
#                0.3.8 起「保存 / 导出」两个按钮不再靠 disable 沉默：新建人设
#                编辑区里点「保存」给出「拒绝保存：人设正文为空…」、点「导出」
#                给出「无法导出：新建人设尚未保存」；非新建人设有未保存改动时
#                导出前先确认，且导出的是保存前那一份原案；「导入会话日志」
#                多一个「仅导最后压缩」（只把最后一段 <compacted-summary>
#                原文渲染进输入框，取消勾选即还原）
#                0.3.9 起那份「可点」的资格不再只认「点过新建」：判据换成
#                `draft.id === ''`，于是内置人设「复制为新人设」也能直接保存
#                （保存＝创建，哪怕一个字符都没改），不会再有「导出叫你先保存、
#                保存却按不动」的死胡同；「没有要保存的改动。」同时收窄成
#                「磁盘上真有的人设 + 三段都没改」，空编辑区单独给这一句
#                0.3.10 起「仅导最后压缩」与「导入思考过程」**解耦**：那一段压缩
#                摘要固定从整份导入文本（带思考那一份，是超集）里取，于是勾着它
#                时切「导入思考过程」文本一个字都不变（压缩摘要是用户方消息、
#                本身又是完整自足的一段），切思考时当场说明一句；取消勾选才按
#                思考勾选还原完整文本
#                0.3.11 起三处文案收敛：切思考时报的就是「只勾仅导最后压缩」那一句
#                （`compactOnlyNotice` 一处构造，删掉原来那句独立文案）；
#                「输入抑制开关」里「本会话还没有过滤掉任何系统注入块…」与末尾
#                「…只能在装配前按来源过滤」两句连同其代码一并删除（有记录时仍按
#                来源列条数，没有就只剩总条数那一行）；「人设历史对话」第二个
#                问号气泡改称「默认写法」，末尾补一句只适用于支持思考的模型
#                0.3.12 起「仅导最后压缩」会提醒丢数据：最后一段 <compacted-summary>
#                之后还有本次新聊的对话时（勾上就没了的那些），提示的下一行多渲染
#                一句红字「段后有未被压缩的新对话，将裁切掉新增历史」—— 勾选时与
#                「勾着它导入日志」时都报；判据 `compactTailHasDialogue()` 会先把
#                <user_message> 一类收尾标签、CONTEXT_ROAD:/CONTINUE_CONTEXT.
#                两行定位符与 <system-reminder> 外框剥掉，框架不算对话
#                0.3.13 起删除人设之后列表**一条勾边都不画**（闸门 `noPreview` 只
#                压「没选中时落在这一层启用的那一条上」那条兜底；载入某一条人设或
#                点「新建」时复位），于是渲染结果与「新建」时完全一致；删除的提示
#                从「已删除」改成「人设已删除」，并且**选中某一条人设预览时也会被
#                清掉**（原来它只在走 `run()` 的动作开始时清，会一直挂着）
#                0.3.14 起导入侧换语义：会话日志**默认**只导入压缩视图（被
#                <compacted-summary> 包住的摘要原文，外加最后一段之后的对话），
#                「仅导最后压缩」改名「展开原文压缩」并改成反过来 —— 导入除这些
#                摘要以外的全部原文；两个勾选框叠加生效（「导入思考过程」决定用
#                带/不带 <thinking> 的那一份渲染结果）；0.3.12 那行红字（段后有
#                未压缩的新对话）随之删除，因为压缩视图本来就留着它；提示收成一句：
#                有压缩摘要时只报「文件名 · 字数」、切勾选框一行都不报，没有压缩
#                摘要时才接一句「该历史对话尚未压缩过」（`importViewNotice()` 在
#                有摘要时返回 null）
#                0.3.15 起导入那一路的「文件名 · 字数」也删掉：三条路（导入 / 勾选框 /
#                切思考）现在完全同源 —— 只有「这份日志没压缩过」时出那一句，
#                有压缩摘要时一行提示都不渲染
#                0.3.18 起「人设历史对话」第一个问号气泡末尾补一句：已经聊过的
#                会话切换人设不会继承那段历史，想继承可以把历史正文写进人设正文
#                （不建议这样操作）
#                0.3.19 是「清理 / 正确性 / 兼容 / 架构」四档合并的结果，另有
#                一处合并阶段才暴露的死锁修复。**存储格式升到 v3**：每段「人设
#                历史对话」搬进 `history/<人设编号>.txt`，主文件只留
#                `{ file, chars, bytes, lockedAt }` 摘要；旧格式（正文内联）永远
#                读得懂，第一次读到旧格式时**自动迁移**并留一份
#                `personas.json.v2-backup`（迁移会逐条读回核对，对不上就整个放弃、
#                主文件一个字节不动）。
#                正确性：满额（200 条）时新建不再产生「界面里看得见、磁盘上没有、
#                重启就消失」的幽灵人设；正文超长不再静默截断（只提醒）；
#                磁盘上超限时不再静默删条，而是**全部读入 + 明确拒绝保存，
#                但放行「删除」**（合并阶段修掉的死锁：闸门原本连删除一起拒，
#                而提示还在让用户「先删到上限以内」）；`/state.warnings` 第一次
#                真的显示在设置页顶部（可折叠）；写盘保留不认识的字段（四层）；
#                不可满足的下载区间回 416 而不是 200；导入的「跳过 N 条」补全；
#                「屏蔽 runtime 上下文」真正按会话生效（不再全局锁死）、
#                且过滤时放过平台的「作废通知」。
#                性能：对话热路径（新会话采样 / 切换人设记账）不再整份同步写盘，
#                改成 250 ms 窗口内合并落盘 —— 12 MB 文档上从 64–108 ms 降到
#                0.9–13 ms，事件循环峰值延迟从 69–109 ms 降到 6–13 ms；
#                32 MB 历史时「改个名字点保存」从 595 ms 降到 9.6 ms。
#                兼容：`engines.node` 从 `>=22` 降到 `>=18`（代码真实门槛只到
#                Node 16.9）；`dsh.client.inject` 从 6 条收到 1 条（0.3.21 再清空
#                为 0 条）；README 新增「升级前必查：16 个平台私有
#                契约」一节（⚠ 0.3.26 起索引为 20 个 —— 这里记的是 0.3.22 当时的条数），
#                逐条给出「症状 / 先查哪里 / 怎么确认」。
#                ⚠ 0.3.23 更正：这句原文写的是「代码里真正用到的只有 `react`」——
#                那是**误读**。这个字段是【包名列表】（语义是装配顺序边：列在前面的
#                包要先加载完），不是「本插件 require 了哪些模块」；`react` 是平台
#                种子词，从来不需要写在这里。原文那句已删，语义与最终值（`[]`）见
#                `package.json` 的 `//dsh.client`。
#                清理：删掉零消费者的 `/ping` 路由、12 个客户端从不读的响应
#                字段、2 个真死函数与若干不可达分支；把同一份会话日志被四套实现
#                各扫一遍合成一次遍历（`scanSessionLog()`）、导入视图的全文双扫
#                合成一次、写路径不再重复校验名字 / 正文 / 段序、「保存并启用」
#                不再写两遍盘。
#                0.3.20 修掉 0.3.19 引入的一处**显示误报**：会话记录是合并式写入
#                的（每轮装配都写 `toolBaseline` / `toolStripHeld`），于是
#                「装配过了、但这一轮没有可注入的人设」时记录里**没有**
#                `appliedAt` / `droppedAt` 这两个键；`JSON.stringify` 又把
#                `undefined` 的键整个丢掉，客户端 `assembly.droppedAt !== null`
#                读到 `undefined` 就成立 —— 没选人设的对话于是被报成「人设被顶
#                掉了」，还附上一段「极简模式」的说明（人设选框的悬浮提示同款）。
#                修法三层：宿主 `rememberAssembly()` 先铺一层完整的「什么都不
#                知道」读数（等于恢复 0.3.18 那份整机读数的旧形状，键永远在）；
#                新增 `assembledAt`（每轮装配都记，回答「这个会话到底装配过没
#                有」），并在这一轮**没有想要人设**时把 `appliedAt` / `droppedAt`
#                清成 null、同时撤掉「被顶掉」标记 —— 否则切回「不注入」之后
#                卡片会继续说「已注入」、圆点会一直黄着；客户端判定一律收紧成
#                「必须是个数字」，并把第三种结果单独说清楚（「最近一次装配：
#                本轮没有可注入的人设」，用中性文字，不再借橙色告警说话）。
#                设置页的问号
#                气泡不再被父级 `opacity: 0.75` 带成半透明（淡色正文改用不透明
#                文字色 DIM_TEXT），气泡底与前景色都显式取不透明令牌；「人设管理」
#                标题下方「会话」后面显示当前会话的**标题**（行的 displayTitle，
#                与标题栏同一份；拿不到时退回显示 id）
#                0.3.21 是「只求快与准」的一版：没有新按钮，也**不动数据文件格式**
#                （依旧是 v3）。写盘从同步改成异步并串行化 —— 一次保存期间不再拖住别的
#                对话、正在吐字的模型与别的面板：32× 数据（30.5 MB 历史正文）下事件循环
#                最长停摆 216.81 ms → 31.78 ms、另一进程轮询 /state 的最大间隔
#                146.3 ms → 50.0 ms；写盘本身的总耗时没变快（32× 约 +19%），换来的是
#                **不阻塞**。显示侧：装配卡片与指示点按页分层（「全局」页只说本层、会话级
#                结论只在「当前」页出现，「仅加载人设」的 before/after 对比也改成按会话、
#                没开过那个开关的对话不出现），修掉「卡片说被顶掉、旁边圆点却是绿的」。
#                `/state` 多一个 `etag` 响应头（对外契约）：客户端带 `If-None-Match` 再问、
#                内容一字未变时回 `304` + 空体（`cache-control: no-store` 原样保留 ——
#                条件请求由客户端自己在内存里发），开着设置页不再每 4 秒重下约 36 KB。
#                几张按会话、只涨不落的内存表加 200 上限（被挤出去的老会话，卡片与圆点
#                **一起**回到「不知道」）；历史对话的归一结果做缓存（那份没变就不必每
#                4 秒重算，400 万字那档第一次 40~45 ms、之后 p50 3~7 ms）；设置页对同一个
#                会话列表只订阅一次（从前是 3 份兜底订阅 + 3 次宿主 hook）。
#                客户端拆包：**导入 / 导出（含 PNG 装拆）与会话日志导入（含 ZIP / zstd）
#                拆成两个包内分块** `client.io-export.js` / `client.log-import.js`（必须在
#                包根），点对应按钮时才 `require.async` 取一次（装不上不缓存、下次再试）——
#                主包 client.js 313,482 → 267,827 B（gzip 100,031 → 84,958），两个分块
#                合计 52,895 B（gzip 18,949，不点就永远不来）；诚实记一笔：客户端那一侧
#                总量**净增约 13 KB**，换来首屏少解析约 45.7 KB。
#                ⚠️ **`package.json` 的 `files` 必须含 `client.*.js`**（本包已留这一条）：
#                漏了它，两个分块根本不进发布包，用户点「导出 / 导入」就是 404。
#                另外两件「说清楚」的事：「外面改过文件」的判据从只看时间戳升级成
#                `ino + size + 整份 sha1`（代价：每次多读一遍主文件，约 0.5–0.7 ms，
#                换来「只改一个字、长度不变」也一定看得见）；并**明写**「同一份数据
#                文件只支持一个实例在写」—— 两进程各 150 轮实测：期望 300 次落盘、
#                实际 163 次（**读**是安全的，规避办法见包内 README）。
#                0.3.22 修掉两个用户报的回归，并加一条黄条（存储格式仍是 v3）：
#                ① 「不注入」在对话界面里选不了 —— 0.3.21 的 F1 把「空值」整类
#                判成「请求没写 id」→ 400 empty-request，而对话界面那个人设选框的
#                「不注入」一项一直发的是显式空串（`onPickPersona('')`）。判据收紧
#                成三件事：键不存在 / 值不是字符串 / **只由空白组成** → 400；
#                显式 `id:''` 与 `id:'builtin:off'` → 都是「不注入」（两种写法都
#                收，旧客户端不失效）；其余照旧。客户端也改成发显式 builtin:off。
#                ② 非激活人设的历史文件被外部改过 / 丢掉不再报黄 —— 0.3.21 把逐条
#                核对收窄成「只核当前激活的那一条」，其余推迟到用户点开时，于是
#                没被点开的那条永远不报。回退成**重读时核全部人设**（与 0.3.20
#                一致）并删掉收窄用的 `onlyIds` 参数；代价只发生在重读时（启动、
#                外部改了主文件之后）：8 条 / 7 个历史文件 ≈ 1 ms，一两百条 ≈
#                每次重读 +50 ms，**不是**每 4 秒那次轮询。配套给 `/state` 的提醒
#                出口加去重（`uniqueWarnings()`）—— 重读与「点开那一条」会产生
#                同一句话，不去重就是同一件事说两遍。
#                ③ 新黄条 `history-not-carried`：在一个已经聊过的会话里换成人设
#                之后，那条人设的「人设历史对话」不会补注入（按设计只在每个新会话
#                的第一步注入），现在明说「想让这段历史生效，请新开一个对话」。
#                窄口径 —— 只有这个会话真的换过人设（`state.personaSwitched`，
#                **只在内存**，重启 Web 后清零）、日志里从没注入过、模型已经回过
#                话、当前人设确实有非空历史，四条同时成立才报；已经注入过只是对
#                不上的仍走 `history-mismatch`。中英字典各 +1 条（159 → 160）。
#                判据翻面牵动的用例逐条 before/after 记在
#                `ps2/verify-已接受改动-0.3.22.md`（`g-store.mjs` G3 三条、
#                `f-routes.mjs` F1 +2 格、`p1-history-missing.mjs` 键数）；
#                共享套件 `verify.mjs` 零改动，364/0。
#                0.3.23（存储格式仍是 v3，不迁移）：
#                · 修「导出图片」的硬 bug —— `if (!isPng(bytes))` 写在自己的
#                  `const { isPng, … } = await ioExport()` 之前（同一块作用域里的
#                  TDZ），每次点都是一句「导出失败：Cannot access 'isPng' before
#                  initialization」。功能级不可用，用例 `ps3/tests/c1-export-png-tdz.mjs`。
#                · 包内分块「装不上」之后不再永远装不上（`chunkCache` 清掉失败的
#                  Promise，只在"还是同一个 Promise"时删）。
#                · 提醒出口满 50 条不再静默丢弃：改成插入序 Map + 淘汰最旧一条，
#                  真淘汰过就在末尾多报一句。
#                · `/switches` 的 `{pureChat:false}` 单独挡下（`400 bad-pure-chat`
#                  并说清怎么退出），不再掉进「请求里没有任何可改开关」。
#                · `strippedMessages` 按会话报（进程级累计另走新的
#                  `strippedMessagesTotal`），「当前」页那一行文案跟着改。
#                · 一轮对话里对主文件的整份读取 + sha1 从三次降到一次：拿宿主那一轮
#                  的 `AbortSignal` 当「问盘事务」的身份证（装配的 context 与
#                  pre-step 的载荷是同一个 signal）；`statCache` 改用专属哨兵，
#                  数据文件不存在时也不再每次重新 stat。
#                · 设置页与对话框**共用一份状态 + 一条 `/state` 轮询**（按会话 id
#                  共享；最后一个消费者退订时整条拆掉），后加入的消费者不再单发一条。
#                · 会话日志扫描：工具定义按对象身份缓存序列化（500 头 × 30 工具
#                  实测 30000 → 15000 次）、`headers` 表封顶 64 条。
#                · 请求体抢跑：`content-length` 就超限的直接 413/400 + destroy，
#                  不再往内存里搬（改前一条只声明不发内容的请求会永远挂着）。
#                · 「宿主那一格」的 hook 格数风险消掉：外面套一层零 hook 的壳，
#                  把「这一帧有没有宿主」写进内层元素的 `key` —— React 重挂载，
#                  而不是让 React 发现格数变了（那是整块白屏）。
#                · 语言字典重复注册包 try（幂等错误吞掉、只留一行 console 警告），
#                  不再把整个插件拖成一张降级卡片。
#                · 小问题：导出兜底名跟 MIME 走（PNG 不再兜成 persona.json）、
#                  大上传超时按体积放宽到 3 分钟、zstd 多帧按帧头算长度
#                  （压缩数据里恰好出现 magic 不再静默读到一半）、`stripByKind`
#                  一趟走完、`onDiscardNew` memo 化。
#                · 架构：设置页与选择框搬进包内分块 `client.settings.js` /
#                  `client.picker.js`（主包约 280 KB → 约 155 KB）。槽位同步注册的
#                  是一个**壳**：分块到了就把真身作为子元素渲染；装不上显示一张可读
#                  的错误卡片 + 重试（`data-chunk-error` / `data-chunk-retry`）。
#                  ⚠ 这四个分块都必须打进包（打包脚本的自检会逐条比对）。
#                · 明确**没做**：`/state` 的 ETag 缓存。实测 200 条人设的 /state
#                  平均 8.2 ms，其中可缓存的部分（stringify + sha1）只有 1.6 ms，
#                  而任何「跳过工作」的缓存都要一个覆盖全部输入的版本号 —— 漏一项
#                  就是客户端永远收到 304、界面停在旧值。收益已在「轮询减半」里拿到。
#                · 用例：`ps3/tests/run-all.sh`（15 个文件，全部「改前必红、改后必绿」）；
#                  共享套件 364/0、档 2/4/5/6 全绿。
#                0.3.24（存储格式仍是 v3，不迁移）：修「导入思考过程」关不干净 ——
#                症状：导入一份**带着本插件注入过的人设历史**的会话日志时（那段历史
#                正是上次勾着「导入思考过程」导入、存进人设、又被注入回来的那一份），
#                `<thinking>` 会跟着注入壳一起回到输入框，**取消勾选也清不掉** ——
#                看上去是「上次的思考洗不掉、本次的洗得掉」。
#                成因：`renderSessionEvents()` 里只有模型方那条分支看
#                `includeThinking`，「已经带壳的历史」走的是 `role:'raw'` 的
#                **原文照发**分支（`unwrapPersonaHistory()` 只剥壳、不动正文），
#                它压根不看那个勾 —— 勾选框在那条路上是空操作（勾上 / 不勾输出
#                逐字相同）。
#                改法：渲染的最后一步按区段剥。`stripThinkingOutsideSummaries()`
#                用 `scanSummarySpans()` 把 `<compacted-summary>…</compacted-summary>`
#                标成**保护区**（那一段按 0.3.14 的约定原文照搬，里面的思考照留），
#                保护区之外交给 `stripThinkingInRegion()` 按**层数**删整段思考：
#                嵌套标签不会只删一半；没有收尾标签时按「它之后到区段末尾都算
#                思考」处理（宁可多删，不留半截）；孤立的**收尾**标签只丢标签本身
#                （那更像正文提了一嘴，不像一段思考的开头）。于是两个勾选框的四种
#                组合都不会再漏出思考，而**勾上时的输出与 0.3.23 逐字相同**。
#                顺带：同一个摘要正则收成 `scanSummarySpans()` 一份定义
#                （`scanCompactedSummaries()` 改为走它），别让「剥思考」和「扫摘要」
#                各写一遍标签名。
#                门槛：只在整份文本里真的出现过 `<thinking>` 时才动它（没有就原样
#                返回），所以不带思考的日志连一个字都不会被改写。
#                ⚠ 0.3.26 更正：这条门槛原来只认 `<thinking>`，于是「整份文本里一个
#                开头标签都没有、只有一个孤立收尾标签」会整段原样返回 —— 上面那句
#                「孤立的收尾标签只丢它自己」实际不成立（导入的正文里会留下一个
#                `</thinking>`）。现在按两个标签任一出现即进入剥离，早退只留给「两个
#                标签都没有」的文本（那一条行为一字未变）。
#                0.3.25（存储格式仍是 v3，不迁移）：子会话继承父会话的设置与人设 ——
#                症状：侧栏「分叉」出来的子对话不继承父对话的设置，反而跟随全局；
#                而「选一个没有记录的旧对话」却会当场给它记一份，两者看起来不一致。
#                成因：设置是纯按会话 id 的两层模型（`effectiveLayerOf()`：有记录
#                读记录，没有读顶层），而唯一的新建入口 `sampledRecord()` 只读顶层
#                （全局层）；全包没有任何一处读父子血缘，虽然 DSH 把父 id 摊在列表行
#                上（插件已经在读那一行，只看 `blank`）。子会话于是抄了一份全局快照，
#                而采样只发生一次（`ensureSessionRecord()` 见到记录就返回），那份
#                错值再也不会被纠正。
#                改法：`sampledRecordFrom(doc, parentId, now)` 从一个「有效层」取值
#                （父有记录读父那一份、父没有落回全局），`sampledRecord()` 变成
#                「没有父」的薄包装 —— 与改前**逐字节等价**，这是回归基线。
#                父 id 的三条来源：请求体的 `parent`（客户端从列表行 `row.parentId`
#                转发，见 `client.js` 的 `parentOf()`；三态，缺失 = 不知道）→ 活会话的
#                `session.header.parentSession` → `agent.session.header.parentSession`。
#                采样时机补了一处：`agent/created` 里，**有父**的 agent 一建起来就先
#                继承一份（`afterAssembly: false`，不写 `promptPersonaId`，那个读数由
#                第一次真请求时的 `convergeOnPersonaSwitch()` 自己学）。为什么必须抢在
#                装配之前：装配发生在 `agent/pre-step` **之前**，在那里采样的话子会话
#                第一轮的人设段 / 段序 / runtime 抑制器全都按全局层渲染过一轮。分叉子
#                本来靠 `/resident` 抢在前面（选择框在你开口前就问过），但
#                `subagent` / `subagent_fork` 没有选择框，只有这一条路。
#                `/resident` 同时收紧一处：看不见这个会话、客户端又没明说它的父是谁时
#                **不采样** —— 只看客户端那位 `blank: false` 的话，分叉子（非空 + 宿主
#                还没恢复起来）会拿到一份读不到 `parentSession` 的全局快照并被永久钉死。
#                现在要求「宿主看得见（header 读得到）」**或**「客户端明确回答过父是谁」，
#                两条都不成立就交给三条读得到 header 的路补上（选择框每 3 秒重试、
#                `agent/created`、首次对话的 pre-step）。
#                另一层：`origin === 'subagent'` 的子会话继承设置与人设词，但**不注入
#                「人设历史对话」**（②那一步加一个 `!isSubagentChild`）。判据刻意是
#                `origin` 而**不是**「有父会话」：侧栏 Fork 同样有 `parentSession`，但它是
#                独立对话，要带着继承来的历史（`SessionStore.fork()` 只写
#                `parentSession` + `isSeeded`；`childSessionMeta()` 才多写
#                `origin: 'subagent'`）。
#                ⚠ 已知限制（本版**没**做）：`subagent_fork` 从父日志前缀里**继承**进来的
#                那条 `source.kind === 'persona-history'` 消息删不掉。它是 fork 时按前缀
#                复制的**既有事件**，而 `agent/pre-step` 拿到的 `decision.messages` 只是
#                **本步新增**的消息（`dsh-agent-loop` 的 `inbox.claim()`）；请求里的历史由
#                `session.deriveMessages()` 从会话 surface 重新导出，按来源过滤够不着它。
#                要在子会话请求里滤掉它得占用 surface 层（消息投影 / 一次 replace 遮蔽），
#                风险与本版范围都不允许，留待后续。
#                明确**没做**：`layerFor` 的写路径（理由见 0.3.25 的交接文档 §6 ——
#                分叉在用户动手之前就已有记录，体感收益 ≈ 0，而提前建一份全局快照会
#                把继承永久钉死）；已有记录不回溯（要修得显式要求）。
#                顺带修掉一处版本读数漂移：`index.js` 的 `PLUGIN_VERSION` 从 0.3.23
#                起就没跟着发布走（0.3.24 的 `/state` 一直报 0.3.23），本版一并补上。
#                0.3.26（存储格式仍是 v3，不迁移）：上一版交付后逐处复核出来的六件事，
#                全部是「注释说的」与「代码做的」对不上的地方，没有改任何判据的语义：
#                ① 「导入思考过程」的门槛（见上面那条 ⚠ 更正）：剥思考现在按两个标签
#                   任一出现即进入，孤立的 `</thinking>` 真的只丢它自己。
#                ② `/persona` 的历史文件核对提醒改走 `rememberNotice()`：
#                   症状：反复点开同一条「历史文件不在 / 读不出来」的人设，同一句话会
#                   随点选次数堆进常驻的 `state.warnings`（出口 `uniqueWarnings()` 会去重，
#                   所以界面一直看不出差别，坏的是那份数组本身）。
#                   成因：`state.warnings` 的定位是「只在 `reload()` 时整体替换」，而
#                   `auditHistoryFileOf()` 把去重明确交给调用方（`lib/store.js`）；
#                   `/persona` 那条路传进去的正是常驻数组。改成局部数组 + `rememberNotice()`
#                   （50 条封顶 + 整句去重），与 `/state` 那条路（`viewOf()` 的局部
#                   `historyAudit`）同构。
#                ③ `pruneHistoryFiles()` 只在「落盘后核对确认这份文件还是我们的」时才跑：
#                   症状：两个写者同时在保存时，历史正文可能凭空消失（对方再读只会看到
#                   「历史对话文件不在了」）。
#                   成因：写后核对已经判出「这份文件被换掉了」（`fileChangedByOther`），
#                   但 prune 仍按**自己那份**引用清单去清孤儿文件 —— 活着的对方那一份
#                   可能引用着我们没引用到的 `history/<编号>.txt`。`commit()` 在这个分支上
#                   本来就丢掉自己那份记账并 `reload()`，「不记账 + 不删」才是一致的处置。
#                   代价与「清理失败」同档：最多留几个孤儿文件，下一次真正由本插件落盘的
#                   保存会清掉。
#                ④ 删掉 `writeLayer()` 的第五个参数 `baseDoc` 与对应分支：全仓没有任何
#                   调用点那样用（旧注释写的「只有一个调用点这样用」是假的），留着会让
#                   读者以为存在一条绕过 `saveWithRetry()` 的落盘路径，从而对
#                   `stale-baseline` 的覆盖面做错误推断。落盘统一走 `saveWithRetry()`。
#                ⑤ 注释里的契约条数从 16 补到 20（`client.js` 两处、`index.js` 一处），与
#                   README 索引的 20 条一致。本文件里那条「16」写在 0.3.22 的历史记录里，
#                   保留不改（那是当时的实情）。
#                ⑥ README 补一条已知限制：不勾「导入思考过程」时，正文里自己写出来的
#                   `<thinking>` 字面量会连同它后面到区段末尾的内容一起被删掉 ——
#                   判据是「宁可多删，不留半截思考」（截断日志里的半截既不是正文也不是
#                   合法标记），压缩摘要包住的那一段不受影响。要原样保留就写转义。
#                明确**没做**（复核时看到、但属于设计取舍或收益不足）：接缝换行（实测
#                摘要外最大连续换行恒为 2，「可能堆到 4 行」不成立）；`chunkDeps()` 多传
#                的依赖名（那份名单本来就是探针实测 + 「多写不碍事」）；`parentSessionIdOf()`
#                外层那个冗余 try/catch；`useMainSessionRow()` 里等价于直接传 `parent` 的三元；
#                `scanSessionLog()` 里只用一次的 `kind` 变量；`historyMismatchOf()` 的
#                `activeHistoryOf()` 惰性化（`text.length` 就在 `canonicalHistoryCached()`
#                的缓存键里，惰性化要动缓存失效语义，不是省一次 stat 的事）；
#                以及无父 agent 的 `agent/created` 是否还要 `beginStat + refresh`（省的是
#                亚毫秒，却要动「有父才在装配前继承」那条明确写下的时序纪律）。
#                0.3.27：兼容性复核之后**只动了一处对外的副作用** —— 注入的那张全页
#                样式表不再锚通用属性名。
#                症状：别的插件若也用 `data-history-text` 标记自己的滚动容器，它的滚动
#                条会被本插件一起藏掉（`width:0;height:0`）—— 而这张样式表是
#                `document.head` 注入、**全页生效**的，不属于本插件的 DOM。
#                成因：`ensureScrollCss()` 的七条规则里六条已经锚在 `data-persona-*`
#                上，只有这一条锚在裸的 `data-history-text` 上，而那个名字太通用。
#                改法：属性改名 `data-history-text` → `data-persona-history-text`
#                （渲染处 `client.settings.js` 的文本框与 `client.js` 的 CSS 同步改 ——
#                两处必须一起动，否则历史文本框的滚动条会重新露出来），并在这张样式表
#                上立一条约束：**凡是被它锚上的属性都必须带 `persona` 前缀**。
#                为什么只做这一处：同一次复核里另外六条逐条按「是否新增失败模式 /
#                是否把响亮的失败变安静 / 是否重复宿主已有的保护」量过 ——
#                两条是纯文档（契约表补 0.3.25 的四条、`bundle URL` 那句注释写的是包名
#                而实际是 `/plugins/??<profile 行 id>/client.js&rev=…`），可与下一个功能版
#                一起发；两条按原方案做会**打断本插件自己现有的行为**（把
#                `[data-history-text]` 收窄到 `[data-persona-wrap]` 之下看似"一处字符串"，
#                实际那个文本框在 `data-history-wrap` 里、不在 `data-persona-wrap` 里，
#                规则会一条都匹配不上；`rejected()` 加 `typeof` 若写成 fail-open 就是
#                关掉鉴权栅栏 —— 现在的行为已经是 fail-closed，异常往 `webServer` 冒）；
#                两条是负优化（客户端比对版本弹重启横幅重复了宿主的 `rev` + immutable
#                cache + 旧 batch 保留；把 `order` 改成运行时现算，别人依旧能用负
#                `priority` 插队，拿不到任何新性质）。逐条结论不在这里重复。
#                0.3.5 起指示点改成「全部触发项的清单」（红在前、黄在后）并
#                在装配判断下方逐条按自己的颜色说明，极简模式单独报黄、
#                列表勾边没选中时落在正在启用的那一条上、「启用」的提示
#                移到并列按钮正上方）
#                + 新会话模式选择窗口的人设选择器
#                （本包 client.js，由 package.json 的 `dsh.client` +
#                 exports["./client"] 编入 __DSH_BOOT__，
#                 bundle URL 为 /plugins/dsh-persona-select/client.js）
#
# 为什么只有一行：`dsh.client` 是**包级**声明，不是行级声明。
#
# 挂载位置：profile（Host）树，**不是** agent preset。
#   本插件的 prompt 段用自己独有的段名（plugin:persona-select），
#   不占用 `deployment:persona-prefix`，因此不会与提示词注册表自身的注册相撞；
#   既然不撞名，就没必要挤进 preset 作用域——全局注册让所有人设对所有
#   没有声明 complete:true 的 preset 都生效。
#   0.2.8 起「每个会话排在自己的段序上」靠 `agent.ctx` 上的同名 scoped 注册
#   （平台原话：per-agent override 要通过那个 agent 的 `agent.ctx` 注册），
#   那条路要求行本身挂在能被 agent 继承到的位置，profile 层满足。
#
# 可选配置（写在本行的 config 下）：
#   sectionOrder  没填过权重的人设用的兜底段序，默认 -1
#
# name 必须是实际包名：cordis 按 name import 包，写错会直接起不来。
- insert:
    - id: persona-select
      name: dsh-persona-select
